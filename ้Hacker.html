<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacker Terminal</title>
    <style>
      :root {
        --bg: #07110f;
        --bg-2: #0d1f1c;
        --panel: rgba(10, 24, 22, 0.9);
        --line: rgba(87, 255, 178, 0.35);
        --green: #5ef2a1;
        --green-2: #8dffc9;
        --text: #d7ffe9;
        --muted: #7ac7a0;
        --shadow: rgba(94, 242, 161, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(94, 242, 161, 0.22), transparent 30%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .terminal {
        width: min(92vw, 420px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 0 35px var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid var(--line);
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .dot.red { background: #ff5f57; }
      .dot.yellow { background: #ffbd2e; }
      .dot.green { background: #28c840; }

      .title {
        letter-spacing: 1px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
      }

      .content {
        padding: 28px 22px 24px;
      }

      .prompt {
        font-size: 14px;
        color: var(--green-2);
        margin-bottom: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .prompt span {
        color: var(--text);
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(8, 17, 14, 0.9);
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(94, 242, 161, 0.12);
      }

      .btn {
        margin-top: 6px;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        background: linear-gradient(135deg, var(--green), #3ee6a2);
        color: #062d1f;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 25px rgba(94, 242, 161, 0.18);
      }

      .status {
        min-height: 22px;
        margin-top: 8px;
        font-size: 13px;
        color: var(--green-2);
      }

      .foot {
        text-align: center;
        color: var(--muted);
        font-size: 11px;
        margin-top: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="terminal">
      <div class="topbar">
        <div class="dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="title">secure login</div>
      </div>

      <div class="content">
        <div class="prompt">root@localhost:~<span> $</span></div>

        <form id="loginForm">
          <label>
            Username
            <input type="text" id="username" placeholder="Enter username" required />
          </label>

          <label>
            Password
            <input type="password" id="password" placeholder="Enter password" required />
          </label>

          <button type="submit" class="btn">Access System</button>
          <div class="status" id="status">System ready...</div>
        </form>

        <div class="foot">terminal v2.0</div>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const status = document.getElementById('status');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          status.textContent = 'Error: username and password required.';
          status.style.color = '#ff8c8c';
          return;
        }

        status.textContent = 'Authenticating...';
        status.style.color = '#8dffc9';

        setTimeout(() => {
          status.textContent = 'Access granted for ' + username + '.';
          status.style.color = '#5ef2a1';
          form.reset();
        }, 1000);
      });
    </script>
  </body>
</html>
